[project]
name = "keyboardviewer"
version = "0.2.0"
description = "floating app that shows keyboard shortcuts available on a keyboard"
readme = "README.md"
authors = [
    { name = "postnumbers", email = "post@postnumbers.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dmgbuild>=1.6.7",
]

[project.scripts]
keyboardviewer = "keyboardviewer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
